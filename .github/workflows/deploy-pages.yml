name: Build and Deploy Dashboard

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build WorksCalendar bundle
        run: npm run build:web

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Build dashboard data
        run: python src/build_dashboard.py

      - name: Assemble Pages artifact
        run: |
          rm -rf site
          mkdir -p site/data
          cp -R public/. site/
          cp dist/data/dashboard.json site/data/dashboard.json
          cp dist/data/calendar_events.json site/data/calendar_events.json
          cp dist/web/calendar.js site/calendar.js
          cp dist/web/calendar.css site/calendar.css

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
